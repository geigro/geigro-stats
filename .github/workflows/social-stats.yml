name: Update social stats

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright (needed for the LibertyCity scrape only)
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Fetch stats
        run: node scripts/fetch-social-stats.js

      - name: Commit and push if changed
        run: |
          git config user.name "geigro-stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add social-stats.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update social stats"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i), rebasing onto latest main..."
            git fetch origin main
            git rebase origin/main
          done
          echo "Failed to push after retries" >&2
          exit 1
